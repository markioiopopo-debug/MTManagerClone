plugins {
id 'com.android.application'
id 'org.jetbrains.kotlin.android'
}

kotlin {
jvmToolchain(17)
}

android {
namespace 'com.mtmanager.clone'
compileSdk 35

defaultConfig {
    applicationId 'com.mtmanager.clone'
    minSdk 23
    targetSdk 28
    versionCode 1
    versionName '1.0'
}

compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
}

}
